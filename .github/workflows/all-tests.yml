# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: All Tests
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # NEW: Dynamically discovers every "*.Tests" project folder instead of a hardcoded list.
  # Any new CommonNetFuncs.*.Tests project you add will automatically be picked up here
  # without needing to edit this file.
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover test projects
        id: set-matrix
        shell: bash
        run: |
          # Find every top-level folder ending in ".Tests"
          projects=$(find . -maxdepth 1 -type d -name "*.Tests" -printf "%f\n" | sort)

          if [ -z "$projects" ]; then
            echo "ERROR: No test projects found!"
            exit 1
          fi

          # Convert the newline-separated list into a JSON array for use as a matrix
          json=$(printf '%s\n' "$projects" | jq -R . | jq -sc .)
          echo "Discovered test projects: $json"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  test:
    needs: discover-tests
    runs-on: ubuntu-latest
    container:
      image: zeshue/aspnet9-jammy-ffmpeg:1.0.2
      credentials:
        username: zeshue
        password: ${{ secrets.docker_hub_password }}

    strategy:
      fail-fast: false
      matrix:
        # CHANGED: values now come from discover-tests instead of a hardcoded list
        test-suite: ${{ fromJson(needs.discover-tests.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Get Curl
        run: apt-get update && apt-get install -y curl

      - name: Add LibreOffice
        if: matrix.test-suite == 'Office.Common.Tests'
        run: apt-get install libreoffice -y

      - name: Get Libre Office Version
        if: matrix.test-suite == 'Office.Common.Tests'
        run: soffice --version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Add Fonts
        if: matrix.test-suite == 'Office.Common.Tests'
        run: apt-get update && apt-get install -y fonts-dejavu fonts-liberation fonts-ubuntu

      - name: Update Font Cache
        if: matrix.test-suite == 'Office.Common.Tests'
        run: fc-cache -f

      - name: Add OptiPng
        if: matrix.test-suite == 'Images.Tests'
        run: apt-get install -y optipng

      - name: Add GifSicle
        if: matrix.test-suite == 'Images.Tests'
        run: apt-get install -y gifsicle

      - name: Add JpegOptim
        if: matrix.test-suite == 'Images.Tests'
        run: apt-get install -y jpegoptim

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./${{ matrix.test-suite }}

      - name: Build
        run: dotnet build --no-restore
        working-directory: ./${{ matrix.test-suite }}

      - name: Derive Project Name
        id: derive-project
        run: |
          TEST_SUITE="${{ matrix.test-suite }}"
          PROJECT_NAME="CommonNetFuncs.${TEST_SUITE%.Tests}"
          echo "project-name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "Testing project: $PROJECT_NAME"
        shell: bash

      - name: Check for net8.0 target
        id: check-net8
        run: |
          if grep -q "net8.0" ./${{ matrix.test-suite }}/*.csproj; then
            echo "has-net8=true" >> $GITHUB_OUTPUT
          else
            echo "has-net8=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Test (net10.0)
        run: dotnet test -f net10.0 --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage/net10.0 -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/*.g.cs;**/*.generated.cs;**/*.designer.cs;**/obj/**;**/bin/**" DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[${{ steps.derive-project.outputs.project-name }}]*"
        working-directory: ./${{ matrix.test-suite }}

      - name: Test (net8.0)
        if: steps.check-net8.outputs.has-net8 == 'true'
        run: dotnet test -f net8.0 --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage/net8.0 -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/*.g.cs;**/*.generated.cs;**/*.designer.cs;**/obj/**;**/bin/**" DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[${{ steps.derive-project.outputs.project-name }}]*"
        working-directory: ./${{ matrix.test-suite }}

      - name: Merge Coverage Reports
        if: always()
        continue-on-error: true
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          "$HOME/.dotnet/tools/reportgenerator" -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./coverage/merged" -reporttypes:Cobertura
        working-directory: ./${{ matrix.test-suite }}
        shell: bash

      - name: Coveralls Parallel
        if: always()
        uses: coverallsapp/github-action@v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./${{ matrix.test-suite }}/coverage/merged/Cobertura.xml
          flag-name: ${{ matrix.test-suite }}
          parallel: true
          allow-empty: true

  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

