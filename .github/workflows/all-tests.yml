# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: All Tests
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Discovers every "*.Tests" project folder AND determines which of them need to run,
  # using TRUE dependency-graph awareness: it parses each project's <ProjectReference>
  # entries to figure out what depends on what, then - starting from whatever projects
  # actually changed - walks UP the dependency chain to flag every project (and
  # therefore every test suite) that could be affected, even transitively.
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      all-projects: ${{ steps.set-matrix.outputs.all-projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history to diff against the base commit

      - name: Determine changed test suites (dependency-aware)
        id: set-matrix
        shell: bash
        run: |
          set -e

          # --- Record every test suite that exists, for carryforward/coverage purposes ---
          all_projects=$(find . -maxdepth 1 -type d -name "*.Tests" -printf "%f\n" | sort)
          all_json=$(printf '%s\n' "$all_projects" | jq -R . | jq -sc .)
          echo "all-projects=$all_json" >> "$GITHUB_OUTPUT"
          echo "All known test suites: $all_json"

          # --- Figure out the correct base/head SHAs to diff against ---
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA=""
            fi
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "No base commit available (new branch) - running ALL test suites."
            echo "matrix=$all_json" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files since $BASE_SHA:"
          echo "$changed_files"

          # --- Safety net: shared/global files affect everything, no need to graph it ---
          if echo "$changed_files" | grep -qE '^\.github/workflows/all-tests\.yml$|Directory\.Build\.(props|targets)$|global\.json$|\.sln$'; then
            echo "Global/shared file changed - running ALL test suites."
            echo "matrix=$all_json" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # =========================================================
          # STEP 1: Build the dependency graph from every *.csproj file.
          # ASSUMPTION: each project's csproj filename matches its folder name exactly (true for this repo, e.g. "Core.Tests/Core.Tests.csproj" and "CommonNetFuncs.Core/CommonNetFuncs.Core.csproj").
          # =========================================================
          declare -A dependents   # dependents[X] = space-separated list of nodes that depend ON X

          all_nodes=()
          for dir in */ ; do
            dir="${dir%/}"
            csproj="./$dir/$dir.csproj"
            [ -f "$csproj" ] || continue
            all_nodes+=("$dir")
          done
          echo "Discovered ${#all_nodes[@]} total projects (source + test) with csproj files."

          for node in "${all_nodes[@]}"; do
            csproj="./$node/$node.csproj"

            # Pull out every ProjectReference path, e.g. "..\CommonNetFuncs.Core\CommonNetFuncs.Core.csproj"
            refs_raw=$(grep -oP '(?<=Include=")[^"]+\.csproj(?=")' "$csproj" 2>/dev/null || true)

            while IFS= read -r ref_path; do
              [ -z "$ref_path" ] && continue
              ref_path_unix=$(echo "$ref_path" | tr '\\' '/')
              ref_name=$(basename "$ref_path_unix" .csproj)

              # "$node" depends on "$ref_name" -> record $node as a DEPENDENT of $ref_name
              dependents["$ref_name"]="${dependents[$ref_name]:-} $node"
            done <<< "$refs_raw"
          done

          # =========================================================
          # STEP 2: Seed the affected set with whatever projects had direct file changes (matched purely by top-level folder name).
          # =========================================================
          declare -A affected
          queue=()

          for node in "${all_nodes[@]}"; do
            if echo "$changed_files" | grep -qE "^${node}/"; then
              if [ -z "${affected[$node]:-}" ]; then
                echo "Direct change detected in: $node"
                affected["$node"]=1
                queue+=("$node")
              fi
            fi
          done

          # =========================================================
          # STEP 3: BFS outward through the reverse (dependents) graph so anything that depends on a changed project (directly or through a chain of references) also gets flagged as affected.
          # =========================================================
          while [ ${#queue[@]} -gt 0 ]; do
            current="${queue[0]}"
            queue=("${queue[@]:1}")

            for dep in ${dependents[$current]:-}; do
              if [ -z "${affected[$dep]:-}" ]; then
                echo "Cascading change: $dep depends on $current"
                affected["$dep"]=1
                queue+=("$dep")
              fi
            done
          done

          # =========================================================
          # STEP 4: Extract just the ".Tests" nodes from the affected set -
          # these are the actual matrix entries to run.
          # =========================================================
          selected=()
          for node in "${!affected[@]}"; do
            case "$node" in
              *.Tests) selected+=("$node") ;;
            esac
          done

          if [ ${#selected[@]} -eq 0 ]; then
            echo "No relevant project changes detected - skipping all test suites."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            matrix_json=$(printf '%s\n' "${selected[@]}" | sort -u | jq -R . | jq -sc .)
            echo "Running tests for (including cascaded dependents): $(printf '%s ' "${selected[@]}")"
            echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: discover-tests
    if: needs.discover-tests.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    container:
      image: zeshue/aspnet9-jammy-ffmpeg:1.0.2
      credentials:
        username: zeshue
        password: ${{ secrets.docker_hub_password }}
    env:
      # The container's /etc/localtime is broken, which crashes coveralls-action's Crystal binary with
      # "Time::Location::InvalidLocationNameError: Invalid location name: /UTC" - force a valid TZ instead.
      TZ: Etc/UTC

    strategy:
      fail-fast: false
      matrix:
        test-suite: ${{ fromJson(needs.discover-tests.outputs.matrix) }}

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git
        shell: sh

      - uses: actions/checkout@v4

      - name: Get Curl
        run: apt-get update && apt-get install -y curl

      - name: Add LibreOffice
        if: matrix.test-suite == 'Office.Common.Tests'
        run: apt-get install libreoffice -y

      - name: Get Libre Office Version
        if: matrix.test-suite == 'Office.Common.Tests'
        run: soffice --version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Add Fonts
        if: matrix.test-suite == 'Office.Common.Tests'
        run: apt-get update && apt-get install -y fonts-dejavu fonts-liberation fonts-ubuntu

      - name: Update Font Cache
        if: matrix.test-suite == 'Office.Common.Tests'
        run: fc-cache -f

      - name: Add OptiPng
        if: matrix.test-suite == 'Images.Tests'
        run: apt-get install -y optipng

      - name: Add GifSicle
        if: matrix.test-suite == 'Images.Tests'
        run: apt-get install -y gifsicle

      - name: Add JpegOptim
        if: matrix.test-suite == 'Images.Tests'
        run: apt-get install -y jpegoptim

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./${{ matrix.test-suite }}

      - name: Build
        run: dotnet build --no-restore
        working-directory: ./${{ matrix.test-suite }}

      - name: Check for net8.0 target
        id: check-net8
        run: |
          if grep -q "net8.0" ./${{ matrix.test-suite }}/*.csproj; then
            echo "has-net8=true" >> $GITHUB_OUTPUT
          else
            echo "has-net8=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Test (net10.0)
        run: dotnet test -f net10.0 --verbosity normal --results-directory ./coverage/net10.0
        working-directory: ./${{ matrix.test-suite }}

      - name: Test (net8.0)
        if: steps.check-net8.outputs.has-net8 == 'true'
        run: dotnet test -f net8.0 --verbosity normal --results-directory ./coverage/net8.0
        working-directory: ./${{ matrix.test-suite }}

      - name: Merge Coverage Reports
        if: always()
        continue-on-error: true
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          "$HOME/.dotnet/tools/reportgenerator" -reports:"./coverage/**/coverage.cobertura.*.xml" -targetdir:"./coverage/merged" -reporttypes:Cobertura
        working-directory: ./${{ matrix.test-suite }}
        shell: bash

      - name: Coveralls Parallel
        if: always()
        uses: coverallsapp/github-action@v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./${{ matrix.test-suite }}/coverage/merged/Cobertura.xml
          flag-name: ${{ matrix.test-suite }}
          parallel: true
          allow-empty: true

  finish:
    needs: [discover-tests, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      TZ: Etc/UTC
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          carryforward: ${{ join(fromJson(needs.discover-tests.outputs.all-projects), ',') }} # Prevents Coveralls issues with unsubmitted coverage reports when some test suites were skipped due to no changes


